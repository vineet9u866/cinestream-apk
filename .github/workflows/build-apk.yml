name: Build Android APK (Standalone)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK (SDK 35 + build-tools 35.0.0)
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client (needed for type imports)
        run: npx prisma generate || true

      - name: Build Next.js static export
        env:
          NEXT_OUTPUT: export
        run: npx next build

      - name: Verify static export
        run: |
          ls -la out/
          echo "Static export size:"
          du -sh out/

      - name: Sync Capacitor (copy out/ into Android assets)
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: cinestream-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 90
          if-no-files-found: error

      - name: Show APK info
        run: |
          ls -lh android/app/build/outputs/apk/debug/
          APK_PATH=$(find android/app/build/outputs/apk/debug -name "*.apk" | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Built APK: $APK_PATH"
            file "$APK_PATH"
            ls -lh "$APK_PATH"
          fi
